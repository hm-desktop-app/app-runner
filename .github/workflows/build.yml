name: build

# Windows-only: the application is a Windows tray launcher (frameless window,
# WebView2, -H windowsgui). Frontend assets are embedded with go:embed, so the
# bundle has to be produced before the Go build.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # go.mod declares the minimum language version; the CI toolchain is the
      # current stable release, which is what the project is developed against.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests and bundle
        working-directory: frontend
        run: |
          npm test
          npm run build

      - name: Vet and test the Go service
        run: |
          go vet ./...
          go test ./...

      - name: Build the executable
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/app-runner.exe .

      - name: Report build size
        run: |
          $exe = Get-Item bin/app-runner.exe
          Write-Host ("app-runner.exe: {0:N2} MiB" -f ($exe.Length / 1MB))

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: app-runner-windows-amd64
          path: bin/app-runner.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach the executable to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-runner-windows-amd64
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/app-runner.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "App Runner $TAG" \
            --generate-notes
