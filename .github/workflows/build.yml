name: build

# Windows-only: the application is a Windows tray launcher (frameless window,
# WebView2, -H windowsgui). Frontend assets are embedded with go:embed, so the
# bundle has to be produced before the Go build.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # go.mod declares the minimum language version; the CI toolchain is the
      # current stable release, which is what the project is developed against.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests and bundle
        working-directory: frontend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Vet and test the Go service
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...

      # The icon, manifest and version metadata of the EXE come from a generated
      # .syso file, which needs the pinned Wails CLI.
      - name: Install the Wails CLI
        # Module downloads occasionally fail on transient sum.golang.org errors;
        # the install must also fail the step instead of being masked by echo.
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit 1 }
            Start-Sleep -Seconds 5
          }
          echo "$(go env GOPATH)/bin" >> $env:GITHUB_PATH

      - name: Generate Windows resources
        working-directory: build
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

      - name: Build the executable
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/app-runner.exe .

      - name: Report build size
        run: |
          $exe = Get-Item bin/app-runner.exe
          Write-Host ("app-runner.exe: {0:N2} MiB" -f ($exe.Length / 1MB))

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: app-runner-windows-amd64
          path: bin/app-runner.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach the executable to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-runner-windows-amd64
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # GoReleaser naming: <app>_<version>_<platform>_<arch>.<ext>, for example
          # app-runner_0.2.0_windows_amd64.exe.
          asset="app-runner_${TAG#v}_windows_amd64.exe"
          mv dist/app-runner.exe "dist/${asset}"
          gh release create "$TAG" "dist/${asset}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "App Runner $TAG" \
            --generate-notes
