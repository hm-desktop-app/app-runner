<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>App Runner</title>
 <link rel="icon" href="/appicon.png">
</head>
<body>
<div id="app">

 <div class="window-body">
  <section class="view cmd-view is-active" id="cmd-view" aria-label="命令中心">
   <div class="cmd-search">
    <span class="cmd-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span>
    <input id="cmd-search" placeholder="搜索名称、分类、备注或入口；支持拼音；输入 > 只看命令" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="cmd-results" aria-label="搜索应用或命令">
    <kbd class="esc">Esc</kbd>
    <button type="button" class="win-close" id="cmd-close" title="收起窗口" aria-label="收起窗口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
   </div>
   <div class="cmd-body">
    <div class="cmd-results" id="cmd-results" role="listbox" aria-label="搜索结果"></div>
    <aside class="cmd-peek" id="cmd-peek" aria-label="预览"></aside>
   </div>
   <footer class="cmd-foot">
    <div class="cmd-stats" id="cmd-stats"></div>
    <div class="cmd-keys"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 运行</span><span><kbd>E</kbd> 编辑</span><span><kbd>Ctrl K</kbd> 聚焦</span></div>
   </footer>
  </section>

  <section class="view lib-view" id="lib-view" aria-label="应用库">
   <div class="lib-toolbar">
   <button type="button" class="lib-back" id="lib-back" title="返回命令中心 · Esc" aria-label="返回命令中心"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button>
    <div class="lib-title"><h2>应用库</h2><p id="lib-count"></p></div>
    <label class="lib-search"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span><input id="lib-search" placeholder="搜索名称、分类、备注或入口；支持拼音…" autocomplete="off" spellcheck="false" aria-label="搜索应用"></label>
    <div class="lib-tools">
     <select class="sort" id="lib-sort" aria-label="排序方式"><option value="recent">最近使用</option><option value="name">名称</option><option value="modified">更新时间</option></select>
     <button type="button" class="btn primary" id="new-app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建应用</button>
     <button type="button" class="win-close" id="lib-close" title="收起窗口" aria-label="收起窗口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
   </div>
   <div class="lib-body">
    <aside class="lib-filters" id="lib-filters" aria-label="筛选"></aside>
    <div class="lib-table-pane">
     <div class="table-scroll">
      <table class="lib-table">
       <thead><tr><th>应用</th><th>分类</th><th>上次使用</th><th>状态</th><th class="action-head"></th></tr></thead>
       <tbody id="lib-table"></tbody>
      </table>
     </div>
     <div class="lib-selection" id="lib-selection"></div>
    </div>
   </div>
  </section>

  <div class="sheet-layer" id="sheet-layer" aria-hidden="true">
   <div class="sheet-scrim" id="sheet-scrim"></div>
   <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head"><div><h2 id="sheet-title"></h2><p id="sheet-sub"></p></div><button type="button" class="sheet-close" id="sheet-close" aria-label="关闭面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot" id="sheet-foot"></footer>
   </aside>
  </div>
 </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="activity" id="activity" role="status" popover="manual"><span class="spinner" aria-hidden="true"></span><span id="activity-text"></span></div>

<dialog id="category-dialog"><form id="category-form"><h2>新建分类</h2><p id="category-dialog-message"></p><label for="category-name">分类名称</label><input id="category-name" autocomplete="off" placeholder="如：开发工具"><p id="category-dialog-error" role="alert"></p><div class="dialog-actions"><button id="category-cancel" type="button">取消</button><button id="category-create" type="submit" class="primary">创建分类</button></div></form></dialog>
<dialog id="group-edit-dialog"><form id="group-edit-form"><h2>编辑分类</h2><p id="group-edit-summary"></p><label for="group-edit-name">分类名称</label><input id="group-edit-name" autocomplete="off"><p id="group-edit-error" role="alert"></p><p class="dialog-hint">删除分类后，组内应用会移至“未分类”。</p><div class="dialog-actions"><button id="group-delete" type="button" class="danger-button">删除分类</button><button id="group-edit-cancel" type="button">取消</button><button id="group-rename" type="submit" class="primary">重命名</button></div></form></dialog>
<dialog id="update-source-dialog" class="source-dialog"><form id="update-source-form"><h2>安装更新</h2><p id="update-source-title"></p><div id="update-source-fields"><label>来源类型<select id="update-kind"><option value="archive">压缩包（ZIP / 7z）</option><option value="directory">目录</option></select></label><label>更新来源<div class="source-path"><input id="update-source" placeholder="选择来源，或粘贴完整路径" autocomplete="off"><button id="update-browse" type="button">选择…</button></div></label><small>按已保存的更新步骤安装，开始前完整备份至 content.bak。</small></div><p id="update-source-error" role="alert"></p><div class="dialog-actions" id="update-source-actions"><button id="update-source-cancel" type="button">取消</button><button id="update-install" type="submit" class="primary">安装更新</button></div><div class="dialog-actions" id="update-result-actions" hidden><button id="update-delete-backup" type="button">删除备份</button><button id="update-keep-backup" type="button" class="primary">保留备份并关闭</button></div></form></dialog>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
